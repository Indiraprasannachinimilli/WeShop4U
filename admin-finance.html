<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeShop4U — Finance Admin</title>
<style>
:root{--bg:#fffaf0;--card:#fffdf8;--gold:#b8750b;--line:#e5c98b;--maroon:#842d0d;--text:#202630;--muted:#65717d;--green:#0a8b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:18px}.brand{text-align:center;font-family:Georgia,serif;color:var(--maroon);font-size:34px;font-weight:700}.tag{text-align:center;color:var(--muted);font-size:12px;margin:4px 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.card h2,.card h3{margin:0 0 12px;color:var(--maroon);font-family:Georgia,serif}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.two{grid-template-columns:repeat(2,1fr)}label{display:block;font-size:11px;font-weight:700;margin-bottom:4px}input,select,textarea{width:100%;min-height:36px;border:1px solid #c9d3dc;border-radius:5px;padding:7px;background:white}textarea{min-height:72px}.btn{border:1px solid #a96705;background:linear-gradient(#d59a2f,#b36e07);color:white;font-weight:700;border-radius:5px;padding:9px 15px;cursor:pointer}.btn.alt{background:white;color:var(--maroon);border-color:#dbb15e}.btn.danger{background:white;color:#a21b1b;border-color:#e1aaaa}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.grow{flex:1;min-width:220px}.msg{font-size:12px;color:var(--muted);margin-top:8px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#fff7df;border:1px solid #e5c16d;border-radius:8px;padding:12px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;font-size:22px;color:var(--maroon);margin-top:3px}.due strong{color:#a21b1b}.paid strong{color:var(--green)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #e5e0d7;text-align:left}th{background:#fff9eb}.table-wrap{overflow:auto}.hidden{display:none!important}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.review{display:grid;grid-template-columns:72px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.review img{width:72px;height:72px;object-fit:cover;border-radius:7px}.stars{color:var(--gold)}@media(max-width:700px){.grid,.two,.summary{grid-template-columns:1fr}.review{grid-template-columns:1fr}.review img{width:100%;height:170px}.wrap{padding:10px}.brand{font-size:28px}}
@media print{.no-print,#loginCard,#reviewsCard{display:none!important}.wrap{max-width:none}.card{border:0}.brand{font-size:26px}}
</style></head><body><div class="wrap"><div class="brand">WeShop4U</div><div class="tag">Finance • Delivery • Receipts</div>
<div class="card" id="loginCard"><h2>Admin Login</h2><div class="grid two"><div><label>Email</label><input id="email" type="email"></div><div><label>Password</label><input id="password" type="password"></div></div><div class="row" style="margin-top:10px"><button class="btn" id="login">Login</button><button class="btn alt hidden" id="logout">Logout</button></div><div class="msg" id="loginMsg"></div></div>
<div id="app" class="hidden"><div class="topbar no-print"><strong id="who"></strong><div><a class="btn alt" href="./index.html?admin=1" style="text-decoration:none">Orders Admin</a> <button class="btn alt" id="logout2">Logout</button></div></div>
<div class="card no-print"><h2>Find Order</h2><div class="row"><div class="grow"><label>Order ID</label><input id="orderId" placeholder="WS-XXXXXX"></div><button class="btn" id="loadOrder">Load Order</button></div><div class="msg" id="loadMsg"></div></div>
<div id="financeArea" class="hidden"><div class="card"><h2>Order & Delivery</h2><div class="grid"><div><label>Customer</label><input id="customer" readonly></div><div><label>Contact Number</label><input id="contact" readonly></div><div><label>Event</label><input id="event" readonly></div><div><label>Expected Delivery Date</label><input id="expectedDate" type="date"></div><div><label>Actual Delivery Date</label><input id="actualDate" type="date"></div><div><label>Order Status</label><select id="orderStatus"><option>submitted</option><option>confirmed</option><option>out_for_shopping</option><option>purchased</option><option>out_for_delivery</option><option>delivered</option><option>closed</option><option>cancelled</option></select></div></div></div>
<div class="card"><h2>Payment Summary</h2><div class="summary"><div class="metric"><small>Total Charged</small><strong id="chargedView">₹0.00</strong></div><div class="metric paid"><small>Total Paid</small><strong id="paidView">₹0.00</strong></div><div class="metric due"><small>Amount Due</small><strong id="dueView">₹0.00</strong></div></div><div class="grid two" style="margin-top:12px"><div><label>Total Amount Charged</label><input id="totalCharged" type="number" min="0" step="0.01"></div><div><label>Finance / Delivery Notes</label><textarea id="financeNotes"></textarea></div></div><button class="btn no-print" id="saveFinance" style="margin-top:10px">Save Finance Details</button><div class="msg" id="saveMsg"></div></div>
<div class="card"><h2>Payments</h2><div class="grid no-print"><div><label>Amount</label><input id="payAmount" type="number" min="0.01" step="0.01"></div><div><label>Payment Type</label><select id="payType"><option value="advance">Advance</option><option value="payment">Payment</option><option value="balance">Balance</option><option value="refund">Refund</option></select></div><div><label>Method</label><select id="payMethod"><option value="UPI">UPI</option><option value="Cash">Cash</option><option value="Bank Transfer">Bank Transfer</option><option value="Card">Card</option><option value="Other">Other</option></select></div><div><label>Transaction Reference</label><input id="payRef"></div><div><label>Payment Date</label><input id="payDate" type="datetime-local"></div><div><label>Notes</label><input id="payNotes"></div></div><button class="btn no-print" id="addPayment" style="margin-top:10px">+ Add Payment</button><div class="msg" id="payMsg"></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Type</th><th>Method</th><th>Reference</th><th>Amount</th><th class="no-print">Action</th></tr></thead><tbody id="paymentsBody"></tbody></table></div></div>
<div class="card"><h2>Customer Receipt</h2><div id="receipt"></div><div class="row no-print" style="margin-top:12px"><button class="btn" id="printReceipt">Print / Save as PDF</button></div></div></div>
<div class="card no-print" id="reviewsCard"><h2>Reviews Awaiting Approval</h2><div id="reviews"></div><div class="msg" id="reviewMsg"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://flynxttakgqemgccoryq.supabase.co',KEY='sb_publishable_P32mETIY1qBGk8Xf6foNog_C1-ZS31Q';const sb=supabase.createClient(URL,KEY);let order=null,finance=null,payments=[];
const $=id=>document.getElementById(id), money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localInputNow(){const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}$('payDate').value=localInputNow();
async function session(){const {data}=await sb.auth.getSession();const u=data?.session?.user;$('app').classList.toggle('hidden',!u);$('login').classList.toggle('hidden',!!u);$('logout').classList.toggle('hidden',!u);$('who').textContent=u?`Logged in: ${u.email}`:'';if(u)loadReviews()}
$('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMsg').textContent=error?'Login failed: '+error.message:'';if(!error)session()};async function logout(){await sb.auth.signOut();location.reload()}$('logout').onclick=logout;$('logout2').onclick=logout;
$('loadOrder').onclick=loadOrder;async function loadOrder(){const id=$('orderId').value.trim().toUpperCase();if(!id)return;$('loadMsg').textContent='Loading…';const r=await sb.from('customer_requests').select('request_id,name,contact_number,whatsapp_number,whatsapp,event,delivery_expected_date,status').eq('request_id',id).maybeSingle();if(r.error||!r.data){$('loadMsg').textContent=r.error?'Unable to load: '+r.error.message:'Order not found.';return}order=r.data;const f=await sb.from('order_finance').select('*').eq('order_id',id).maybeSingle();if(f.error){$('loadMsg').textContent='Finance table unavailable: '+f.error.message;return}finance=f.data||null;const p=await sb.from('order_payments').select('*').eq('order_id',id).order('payment_date',{ascending:false});if(p.error){$('loadMsg').textContent='Payments unavailable: '+p.error.message;return}payments=p.data||[];$('customer').value=order.name||'';$('contact').value=order.contact_number||order.whatsapp_number||order.whatsapp||'';$('event').value=order.event||'';$('expectedDate').value=finance?.expected_delivery_date||order.delivery_expected_date||'';$('actualDate').value=finance?.actual_delivery_date||'';$('orderStatus').value=finance?.order_status||order.status||'submitted';$('totalCharged').value=finance?.total_amount_charged||0;$('financeNotes').value=finance?.notes||'';$('financeArea').classList.remove('hidden');$('loadMsg').textContent='Order loaded.';render()}
function paidTotal(){return payments.reduce((t,p)=>t+(p.payment_type==='refund'?-Number(p.amount):Number(p.amount)),0)}function render(){const charged=Number($('totalCharged').value||0),paid=paidTotal(),due=Math.max(0,charged-paid);$('chargedView').textContent=money(charged);$('paidView').textContent=money(paid);$('dueView').textContent=money(due);$('paymentsBody').innerHTML=payments.length?payments.map(p=>`<tr><td>${new Date(p.payment_date).toLocaleString()}</td><td>${esc(p.payment_type)}</td><td>${esc(p.payment_method||'')}</td><td>${esc(p.transaction_reference||'')}</td><td>${money(p.payment_type==='refund'?-p.amount:p.amount)}</td><td class="no-print"><button class="btn danger" data-del="${p.id}">Delete</button></td></tr>`).join(''):'<tr><td colspan="6">No payments recorded.</td></tr>';$('paymentsBody').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deletePayment(b.dataset.del));$('receipt').innerHTML=`<p><strong>Order ID:</strong> ${esc(order?.request_id||'')}</p><p><strong>Customer:</strong> ${esc(order?.name||'')}</p><p><strong>Event:</strong> ${esc(order?.event||'')}</p><p><strong>Expected Delivery:</strong> ${esc($('expectedDate').value||'—')} &nbsp; <strong>Actual Delivery:</strong> ${esc($('actualDate').value||'—')}</p><hr><p><strong>Total Charged:</strong> ${money(charged)}<br><strong>Total Paid:</strong> ${money(paid)}<br><strong>Amount Due:</strong> ${money(due)}</p><p><strong>Payment Status:</strong> ${due<=0&&charged>0?'PAID':paid>0?'PARTIALLY PAID':'NOT PAID'}</p><p style="font-size:11px;color:#65717d">Generated by WeShop4U on ${new Date().toLocaleString()}</p>`}
$('totalCharged').oninput=render;$('saveFinance').onclick=async()=>{if(!order)return;const payload={order_id:order.request_id,expected_delivery_date:$('expectedDate').value||null,actual_delivery_date:$('actualDate').value||null,total_amount_charged:Number($('totalCharged').value||0),order_status:$('orderStatus').value,notes:$('financeNotes').value.trim()||null,updated_at:new Date().toISOString()};$('saveMsg').textContent='Saving…';const {error}=await sb.from('order_finance').upsert(payload,{onConflict:'order_id'});if(!error)await sb.from('customer_requests').update({status:payload.order_status,updated_at:new Date().toISOString()}).eq('request_id',order.request_id);$('saveMsg').textContent=error?'Unable to save: '+error.message:'Saved successfully.';if(!error){finance=payload;render()}};
$('addPayment').onclick=async()=>{if(!order)return;const amount=Number($('payAmount').value);if(!(amount>0)){ $('payMsg').textContent='Enter a valid amount.';return }const payload={order_id:order.request_id,amount,payment_type:$('payType').value,payment_method:$('payMethod').value,transaction_reference:$('payRef').value.trim()||null,payment_date:$('payDate').value?new Date($('payDate').value).toISOString():new Date().toISOString(),notes:$('payNotes').value.trim()||null};const {data,error}=await sb.from('order_payments').insert(payload).select().single();$('payMsg').textContent=error?'Unable to add payment: '+error.message:'Payment added.';if(!error){payments.unshift(data);$('payAmount').value='';$('payRef').value='';$('payNotes').value='';render()}};async function deletePayment(id){if(!confirm('Delete this payment entry?'))return;const {error}=await sb.from('order_payments').delete().eq('id',id);if(!error){payments=payments.filter(p=>String(p.id)!==String(id));render()}}
$('printReceipt').onclick=()=>window.print();
async function loadReviews(){const {data,error}=await sb.from('customer_reviews').select('*').eq('approved',false).order('created_at',{ascending:false}).limit(50);if(error){$('reviewMsg').textContent='Reviews unavailable: '+error.message;return}const box=$('reviews');box.innerHTML=(data||[]).length?(data||[]).map(r=>{const img=r.image_path?`${URL}/storage/v1/object/public/weshop4u-review-images/${r.image_path}`:'';return `<div class="review">${img?`<img src="${esc(img)}" alt="Review photo">`:''}<div><div class="stars">${'★'.repeat(r.rating)}</div><strong>${esc(r.customer_display_name||'WeShop4U Customer')}</strong> · ${esc(r.event_type||'')}<p>${esc(r.review_text)}</p><small>${esc(r.order_id)}</small></div><div><button class="btn" data-approve="${r.id}">Approve</button> <button class="btn danger" data-reject="${r.id}">Delete</button></div></div>`}).join(''):'No reviews awaiting approval.';box.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>approveReview(b.dataset.approve));box.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>rejectReview(b.dataset.reject))}
async function approveReview(id){const {error}=await sb.from('customer_reviews').update({approved:true,approved_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadReviews()}async function rejectReview(id){if(!confirm('Delete this review?'))return;const {error}=await sb.from('customer_reviews').delete().eq('id',id);if(error)alert(error.message);else loadReviews()}
session();const q=new URLSearchParams(location.search).get('orderId');if(q){$('orderId').value=q;sb.auth.getSession().then(({data})=>{if(data?.session?.user)loadOrder()})}
</script></body></html>
